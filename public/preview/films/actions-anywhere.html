<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coere Actions on any site</title>
<style>
@font-face{font-family:"Coere Geist";src:url("fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
html.preview video{object-fit:cover}
video::-webkit-media-controls-mute-button,video::-webkit-media-controls-volume-slider,video::-webkit-media-controls-volume-control-container{display:none!important}
video::cue{font-family:"Coere Geist",ui-sans-serif,system-ui,sans-serif;font-size:max(12px,2.1vw);background:rgba(8,14,36,.82);color:#fff}
</style>
</head>
<body>
<video playsinline preload="metadata" poster="actions-anywhere-poster.jpg" data-still="actions-anywhere-still.jpg" aria-label="Coere Actions on any site">
<source src="actions-anywhere.mp4" type="video/mp4">
<track kind="captions" src="actions-anywhere-captions.vtt" srclang="en" label="English">
<track kind="chapters" src="actions-anywhere-chapters.vtt" srclang="en" label="Chapters">
</video>
<script type="application/json" id="cues">{"captions":[{"start":0.0030337508532423205,"end":2.666667,"text":"Cori can work on any page Maya has open."},{"start":2.666667,"end":5.433334,"text":"Maya has a ten question quiz for her operating systems class."},{"start":5.433334,"end":10.047564717861977,"text":"She opens Coere from the toolbar and asks Cori to do the questions."},{"start":10.047564717861977,"end":12.466667,"text":"Cori plans the task on this page and starts."},{"start":12.466667,"end":15.675636664516372,"text":"He reads each question as text, the cheapest way, picks an answer and checks it held."},{"start":15.675636664516372,"end":30.564515680360646,"text":"The bar shows the step he is on, with Take over and Stop."},{"start":30.564515680360646,"end":33.77660892523012,"text":"Submitting cannot be undone, so Cori asks first."},{"start":33.77660892523012,"end":38.633334,"text":"Maya is happy with the answers and allows it."},{"start":38.633334,"end":41.100001,"text":"Next, the intake form for her clinic visit."},{"start":41.100001,"end":48.033333999999996,"text":"She asks Cori to fill it in with her details."},{"start":48.033333999999996,"end":62.31806745922484,"text":"Her name, birth date, email, phone and address come from her memory."},{"start":62.31806745922484,"end":67.69055533965032,"text":"Fields her memory has nothing for stay empty, and so do the optional questions about who she is."},{"start":67.69055533965032,"end":72.200001,"text":"He never types a password or a card number, and he did not submit. She checks it and sends it herself."},{"start":72.200001,"end":76.133334,"text":"This practice quiz has a link that speaks to an assistant, not to Maya."},{"start":76.133334,"end":81.9877080833971,"text":"She asks Cori to do the quiz."},{"start":81.9877080833971,"end":86.200001,"text":"The page tried to tell Cori what to do. He stops, and nothing it asked for happens."},{"start":86.200001,"end":88.666668,"text":"Cori asks before he submits, and stops when a page tries to give him orders."}],"chapters":[{"start":2.666667,"end":12.466667,"text":"A quiz"},{"start":12.466667,"end":24.11627607427946,"text":"Cori answers"},{"start":24.11627607427946,"end":38.633334,"text":"Submit asks you"},{"start":38.633334,"end":72.200001,"text":"A form from memory"},{"start":72.200001,"end":88.666668,"text":"A page that gives orders"}]}</script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var video = document.querySelector('video');
  var data = JSON.parse(document.getElementById('cues').textContent);
  if (params.has('preview')) {
    document.documentElement.className = 'preview';
    var start = Number(params.get('start')) || 0;
    var end = Number(params.get('end')) || 0;
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    video.poster = video.dataset.still;
    video.muted = true;
    Array.prototype.forEach.call(document.querySelectorAll('track'), function (t) { t.remove(); });
    video.addEventListener('loadedmetadata', function () { video.currentTime = start; });
    video.addEventListener('ended', function () { video.currentTime = start; video.play().catch(function () {}); });
    if (end > start) video.addEventListener('timeupdate', function () { if (video.currentTime >= end) video.currentTime = start; });
    new IntersectionObserver(function (entries) {
      if (!entries[0].isIntersecting) { video.pause(); return; }
      video.preload = 'auto';
      if (!still) video.play().catch(function () {});
    }).observe(video);
    return;
  }
  video.controls = true;
  video.muted = true;
  Array.prototype.forEach.call(document.querySelectorAll('track'), function (el) {
    var done = false;
    function fallback() {
      if (done) return;
      done = true;
      var kind = el.kind, cues = kind === 'chapters' ? data.chapters : data.captions;
      el.remove();
      var track = video.addTextTrack(kind, el.label, el.srclang);
      cues.forEach(function (c) { track.addCue(new VTTCue(c.start, c.end, c.text)); });
      track.mode = 'hidden';
    }
    if (el.readyState === 3) fallback();
    el.addEventListener('error', fallback);
    if (el.kind === 'chapters') el.track.mode = 'hidden';
  });
})();
</script>
</body>
</html>
