<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coere Actions: Calendar</title>
<style>
@font-face{font-family:"Coere Geist";src:url("fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
html.preview video{object-fit:cover}
video::-webkit-media-controls-mute-button,video::-webkit-media-controls-volume-slider,video::-webkit-media-controls-volume-control-container{display:none!important}
video::cue{font-family:"Coere Geist",ui-sans-serif,system-ui,sans-serif;font-size:max(12px,2.1vw);background:rgba(8,14,36,.82);color:#fff}
</style>
</head>
<body>
<video playsinline preload="metadata" poster="actions-calendar-poster.jpg" data-still="actions-calendar-still.jpg" aria-label="Coere Actions: Calendar">
<source src="actions-calendar.mp4" type="video/mp4">
<track kind="captions" src="actions-calendar-captions.vtt" srclang="en" label="English">
<track kind="chapters" src="actions-calendar-chapters.vtt" srclang="en" label="Chapters">
</video>
<script type="application/json" id="cues">{"captions":[{"start":0.003068861901197605,"end":2.733333,"text":"Cori can put events on Maya’s calendar."},{"start":2.733333,"end":12.963505575912349,"text":"Maya asks for a meeting with two people, at a time in New York."},{"start":12.963505575912349,"end":18.48004997133207,"text":"She has Human Review on, so the plan waits for Start."},{"start":18.48004997133207,"end":26.666666,"text":"Before anything is saved, Cori shows the event: the title, 2 PM New York time, and both guests from her memory."},{"start":26.666666,"end":28.91994255269001,"text":"In his own Calendar tab, Cori fills in the event, adds the guests and saves it with the invitations."},{"start":28.91994255269001,"end":32.133333,"text":"It sits at 11 AM on her calendar, which is 2 PM in New York."},{"start":32.133333,"end":36.21325169727659,"text":"The chat says it was added, with Delete event if she changes her mind."},{"start":36.21325169727659,"end":46.366666,"text":"A date she never typed comes from her memory. With Autonomous on, Cori just does it."},{"start":46.366666,"end":48.699999000000005,"text":"Cori only invites the people you name."}],"chapters":[{"start":2.733333,"end":18.443967922234123,"text":"Ask Cori"},{"start":18.443967922234123,"end":26.666666,"text":"Review the event"},{"start":26.666666,"end":36.21325169727659,"text":"Saved"},{"start":36.21325169727659,"end":48.699999000000005,"text":"From your memory"}]}</script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var video = document.querySelector('video');
  var data = JSON.parse(document.getElementById('cues').textContent);
  if (params.has('preview')) {
    document.documentElement.className = 'preview';
    var start = Number(params.get('start')) || 0;
    var end = Number(params.get('end')) || 0;
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    video.poster = video.dataset.still;
    video.muted = true;
    Array.prototype.forEach.call(document.querySelectorAll('track'), function (t) { t.remove(); });
    video.addEventListener('loadedmetadata', function () { video.currentTime = start; });
    video.addEventListener('ended', function () { video.currentTime = start; video.play().catch(function () {}); });
    if (end > start) video.addEventListener('timeupdate', function () { if (video.currentTime >= end) video.currentTime = start; });
    new IntersectionObserver(function (entries) {
      if (!entries[0].isIntersecting) { video.pause(); return; }
      video.preload = 'auto';
      if (!still) video.play().catch(function () {});
    }).observe(video);
    return;
  }
  video.controls = true;
  video.muted = true;
  Array.prototype.forEach.call(document.querySelectorAll('track'), function (el) {
    var done = false;
    function fallback() {
      if (done) return;
      done = true;
      var kind = el.kind, cues = kind === 'chapters' ? data.chapters : data.captions;
      el.remove();
      var track = video.addTextTrack(kind, el.label, el.srclang);
      cues.forEach(function (c) { track.addCue(new VTTCue(c.start, c.end, c.text)); });
      track.mode = 'hidden';
    }
    if (el.readyState === 3) fallback();
    el.addEventListener('error', fallback);
    if (el.kind === 'chapters') el.track.mode = 'hidden';
  });
})();
</script>
</body>
</html>
