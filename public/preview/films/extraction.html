<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coere Extraction</title>
<style>
@font-face{font-family:"Coere Geist";src:url("fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
html.preview video{object-fit:cover}
video::cue{font-family:"Coere Geist",ui-sans-serif,system-ui,sans-serif;font-size:max(12px,2.1vw);background:rgba(8,14,36,.82);color:#fff}
</style>
</head>
<body>
<video playsinline preload="metadata" poster="extraction-poster.jpg" data-still="extraction-still.jpg" aria-label="Coere Extraction">
<source src="extraction.mp4" type="video/mp4">
<track kind="captions" src="extraction-captions.vtt" srclang="en" label="English" default>
<track kind="chapters" src="extraction-chapters.vtt" srclang="en" label="Chapters">
</video>
<script type="application/json" id="cues">{"captions":[{"start":0.0020301994670727064,"end":2.666667,"text":"Coere saves your chats from ChatGPT, Claude, Gemini and six more AIs."},{"start":2.666667,"end":9.733334000000001,"text":"Onboarding asks which AIs Maya uses. She picks ChatGPT, Claude and Gemini."},{"start":9.733334000000001,"end":14.366667000000001,"text":"Extract all opens each AI in the background and saves every chat, with a row for each."},{"start":14.366667000000001,"end":18.133334,"text":"Every chat is saved, on this computer only."},{"start":18.133334,"end":27.666667,"text":"Later, Maya has new chats. When she opens an AI, Coere saves them by itself."},{"start":27.666667,"end":33.066667,"text":"Home counts what is saved, and Recently saved leads with the newest chats."},{"start":33.066667,"end":36.933334,"text":"Memory says her DATA 100 lab is due Aug 18, from a chat on Claude."},{"start":36.933334,"end":39.966667,"text":"Today she went back to that chat and said the lab moved to Aug 22."},{"start":39.966667,"end":43.5281577481869,"text":"Coere saved the changed chat and read it again. Memory now says Aug 22."},{"start":43.5281577481869,"end":48,"text":"The old date stays under Earlier, with the message that moved it."},{"start":48,"end":52.199999999999996,"text":"The Library keeps every chat from every AI, to search, read, download or move to another AI."},{"start":52.199999999999996,"end":54.266667,"text":"Saving chats needs no AI and no account."}],"chapters":[{"start":0,"end":9.733334000000001,"text":"Choose your AIs"},{"start":9.733334000000001,"end":18.133334,"text":"Extract all"},{"start":18.133334,"end":33.066667,"text":"New chats come in"},{"start":33.066667,"end":48,"text":"A chat changes"},{"start":48,"end":54.266667,"text":"Your library"}]}</script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var video = document.querySelector('video');
  var data = JSON.parse(document.getElementById('cues').textContent);
  if (params.has('preview')) {
    document.documentElement.className = 'preview';
    var start = Number(params.get('start')) || 0;
    var end = Number(params.get('end')) || 0;
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    video.poster = video.dataset.still;
    video.muted = true;
    Array.prototype.forEach.call(document.querySelectorAll('track'), function (t) { t.remove(); });
    video.addEventListener('loadedmetadata', function () { video.currentTime = start; });
    video.addEventListener('ended', function () { video.currentTime = start; video.play().catch(function () {}); });
    if (end > start) video.addEventListener('timeupdate', function () { if (video.currentTime >= end) video.currentTime = start; });
    new IntersectionObserver(function (entries) {
      if (!entries[0].isIntersecting) { video.pause(); return; }
      video.preload = 'auto';
      if (!still) video.play().catch(function () {});
    }).observe(video);
    return;
  }
  video.controls = true;
  Array.prototype.forEach.call(document.querySelectorAll('track'), function (el) {
    var done = false;
    function fallback() {
      if (done) return;
      done = true;
      var kind = el.kind, cues = kind === 'chapters' ? data.chapters : data.captions;
      el.remove();
      var track = video.addTextTrack(kind, el.label, el.srclang);
      cues.forEach(function (c) { track.addCue(new VTTCue(c.start, c.end, c.text)); });
      track.mode = kind === 'captions' ? 'showing' : 'hidden';
    }
    if (el.readyState === 3) fallback();
    el.addEventListener('error', fallback);
    if (el.kind === 'chapters') el.track.mode = 'hidden';
  });
})();
</script>
</body>
</html>
