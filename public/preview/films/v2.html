<script type="application/json" id="cues">{"captions":[{"start":0.0030313018121911036,"end":3.066667,"text":"Coere builds your memory from your chats and adds it to new ones while you type."},{"start":3.066667,"end":5.276690065853383,"text":"Installing opens onboarding. Cori asks which AIs you use."},{"start":5.276690065853383,"end":9.598351435445611,"text":"Maya uses ChatGPT, Claude and Gemini."},{"start":9.598351435445611,"end":11.533334,"text":"Save starts Extract all on each of them."},{"start":11.533334,"end":15.700000999999999,"text":"Extract all reads each AI and saves every chat, with a row for each."},{"start":15.700000999999999,"end":18.700000999999997,"text":"Every chat is saved on this computer."},{"start":18.700000999999997,"end":21.879454872591275,"text":"Cori asks what to build memory from. Nothing goes to an AI until Maya says yes."},{"start":21.879454872591275,"end":26.233333999999996,"text":"New chats will save by themselves, and context goes into new chats as she types."},{"start":26.233333999999996,"end":30.648772224084347,"text":"Coere reads her chats with Claude and grows the graph as it goes."},{"start":30.648772224084347,"end":34.866667,"text":"Cori works away in the corner. She can close the page, and the build goes on."},{"start":34.866667,"end":38.112792683579336,"text":"Cori finishes the graph with his hammer."},{"start":38.112792683579336,"end":42.4176025247478,"text":"Your memory is ready. Cori offers to show Maya around."},{"start":42.4176025247478,"end":47.46457065660467,"text":"The tour starts at Home, with the AIs Maya uses."},{"start":47.46457065660467,"end":50.68202538532472,"text":"Then the graph: Maya in the middle, a section for each part of her life."},{"start":52.266667000000005,"end":54.87856359558485,"text":"The Memory page draws what Coere knows, with Maya in the middle."},{"start":54.87856359558485,"end":60.824229771637945,"text":"A click opens a section, with its folders and memories."},{"start":60.824229771637945,"end":69.14375525315698,"text":"Search finds a person, whose sheet starts with how to reach them."},{"start":69.14375525315698,"end":73.60000000000001,"text":"Under it, what her chats say about Elena, each with the chat it came from."},{"start":73.60000000000001,"end":75.63333300000001,"text":"Six days later, Maya has new chats on ChatGPT, Claude and Gemini."},{"start":75.63333300000001,"end":78.59082468417427,"text":"When she opens an AI, Coere saves her new chats by itself."},{"start":78.59082468417427,"end":85.35005172850471,"text":"The first time she opens an AI, Cori shows how to call him: Right Option."},{"start":85.35005172850471,"end":88.36666600000001,"text":"A tap brings out his chat, and the card is gone for good."},{"start":88.36666600000001,"end":94.82730784615384,"text":"Then it reads them, and the graph grows."},{"start":94.83333300000001,"end":96.70000000000002,"text":"Six more days pass, and more chats come in."},{"start":96.70000000000002,"end":102.10000000000002,"text":"Home counts what Coere remembers, and Recently saved leads with the newest chats."},{"start":102.10000000000002,"end":106.15832060069974,"text":"In a fresh chat on ChatGPT, Maya asks for help with her PearX interview."},{"start":106.15832060069974,"end":110.33323942017799,"text":"The blue line says Coere will add her prep chat, and shows the AIs it learned from."},{"start":110.33323942017799,"end":115.47452827102983,"text":"The list shows what goes in: the chat, then her memories about PearX and what it links to."},{"start":115.47452827102983,"end":120.99235093721481,"text":"Add chat, Add memory and Ask Cori bring in more, in her own words."},{"start":120.99235093721481,"end":125.01605537872682,"text":"One Enter puts the chat in as a file, with her context in front of the draft, and sends."},{"start":125.01605537872682,"end":128.03333300000003,"text":"ChatGPT starts from the work she already did."},{"start":128.03333300000003,"end":134.71461922790112,"text":"With Voice mode on, she holds Right Option and asks Cori out loud."},{"start":134.71461922790112,"end":140.30000000000004,"text":"She lets go. Cori answers in his chat and says it out loud."},{"start":140.30000000000004,"end":142.36666700000004,"text":"With Browser Use on, Cori can act in her browser too."},{"start":142.36666700000004,"end":147.49349741926812,"text":"On the Cori page she asks for an email in her own words, and Cori shows his plan."},{"start":147.49349741926812,"end":152.40000000000003,"text":"Two people in her mail are called Sam, so he asks which one."},{"start":152.40000000000003,"end":159.33333300000004,"text":"He writes it in his own Gmail tab, in her style. Take over and Stop are on the bar."},{"start":159.33333300000004,"end":163.458406226578,"text":"The draft waits in Gmail for her to send."},{"start":163.458406226578,"end":173.10000000000005,"text":"A bigger search is split across workers, each in a tab of its own."},{"start":173.10000000000005,"end":176.13333300000005,"text":"Their finds merge into one table, each value with the page it came from."},{"start":176.13333300000005,"end":179.72977896567997,"text":"In Settings, Enable Dev Tools adds Statistics to the dashboard."},{"start":179.72977896567997,"end":184.26666600000004,"text":"It counts the tokens memory saved on her PearX send, and what building it cost."},{"start":184.26666600000004,"end":196.2269164385639,"text":"Maya asks Cori to delete everything about Sparrowhawk, her old side project."},{"start":196.2269164385639,"end":201.36884469487885,"text":"Cori counts what it found. Review shows all of it first."},{"start":201.36884469487885,"end":206.71600957357396,"text":"The graph lights the project and its memories, and the sheet says what goes."},{"start":206.71600957357396,"end":211.33333300000004,"text":"Then Coere checks that nothing about it is left."},{"start":211.33333300000004,"end":214.50000000000003,"text":"Coere v2: a memory built from your chats, added as you type, and an app that acts on it."}],"chapters":[{"start":0,"end":5.276690065853383,"text":"Install"},{"start":5.276690065853383,"end":11.533334,"text":"Choose your AIs"},{"start":11.533334,"end":18.700000999999997,"text":"Extract all"},{"start":18.700000999999997,"end":26.233333999999996,"text":"Build your memory"},{"start":26.233333999999996,"end":34.866667,"text":"The graph grows"},{"start":34.866667,"end":39.933334,"text":"Your memory is ready"},{"start":39.933334,"end":52.266667000000005,"text":"Cori's tour"},{"start":52.266667000000005,"end":73.60000000000001,"text":"Your memory"},{"start":73.60000000000001,"end":102.10000000000002,"text":"New chats come in"},{"start":102.10000000000002,"end":128.03333300000003,"text":"Context as you type"},{"start":128.03333300000003,"end":140.30000000000004,"text":"Voice mode"},{"start":140.30000000000004,"end":163.458406226578,"text":"Ask Cori to act"},{"start":163.458406226578,"end":176.13333300000005,"text":"Workers"},{"start":176.13333300000005,"end":184.26666600000004,"text":"Statistics"},{"start":184.26666600000004,"end":214.50000000000003,"text":"Delete a topic"}]}</script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var video = document.querySelector('video');

  if (params.has('preview')) {
    document.documentElement.className = 'preview';

    video.poster = video.dataset.still;

    new IntersectionObserver(function (entries) {
      if (!entries[0].isIntersecting) { video.pause(); return; }
      video.preload = 'auto';
      if (!still) video.play().catch(function () {});
    }).observe(video);
    return;
  }
  video.controls = true;
  Array.prototype.forEach.call(document.querySelectorAll('track'), function (el) {
    var done = false;
    function fallback() {
      if (done) return;
      done = true;
      var kind = el.kind, cues = kind === 'chapters' ? data.chapters : data.captions;

  });
})();
