<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coere Cori Rewrite</title>
<style>
@font-face{font-family:"Coere Geist";src:url("fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
html.preview video{object-fit:cover}
video::-webkit-media-controls-mute-button,video::-webkit-media-controls-volume-slider,video::-webkit-media-controls-volume-control-container{display:none!important}
video::cue{font-family:"Coere Geist",ui-sans-serif,system-ui,sans-serif;font-size:max(12px,2.1vw);background:rgba(8,14,36,.82);color:#fff}
</style>
</head>
<body>
<video playsinline preload="metadata" poster="cori-rewrite-poster.jpg" data-still="cori-rewrite-still.jpg" aria-label="Coere Cori Rewrite">
<source src="cori-rewrite.mp4" type="video/mp4">
<track kind="captions" src="cori-rewrite-captions.vtt" srclang="en" label="English">
<track kind="chapters" src="cori-rewrite-chapters.vtt" srclang="en" label="Chapters">
</video>
<script type="application/json" id="cues">{"captions":[{"start":0.0030665665669409124,"end":2.733333,"text":"Cori can fix or improve text wherever Maya writes."},{"start":2.733333,"end":8.653440040727515,"text":"Maya writes a quick email in Gmail, slips and all."},{"start":8.653440040727515,"end":12.116526114557763,"text":"She selects the paragraph."},{"start":12.116526114557763,"end":17.746420165736815,"text":"Option Shift R opens Cori’s picker beside it: Rewrite, Improve or Fix grammar only."},{"start":17.746420165736815,"end":20.756710490255152,"text":"The fixed text goes in at once. Each change is boxed in blue, only on her screen."},{"start":20.756710490255152,"end":24.902997230082573,"text":"Fix grammar only touches spelling, grammar and punctuation. Her words stay hers."},{"start":24.902997230082573,"end":29.266666,"text":"Looks good keeps it."},{"start":29.266666,"end":35.23760985508849,"text":"In Google Docs she wants a paragraph of her cover letter to read better."},{"start":35.23760985508849,"end":41.69971029678282,"text":"This time she picks Improve."},{"start":41.69971029678282,"end":45.31492041832596,"text":"Improve may reword a sentence, and it keeps every fact she wrote."},{"start":45.31492041832596,"end":50.599999000000004,"text":"She prefers her own words. Go back returns them exactly."},{"start":50.599999000000004,"end":60.783450967427825,"text":"It works in any text box, like her chat with Claude."},{"start":60.783450967427825,"end":67.79999900000001,"text":"Fixed in place, ready to send."},{"start":67.79999900000001,"end":70.06666600000001,"text":"The blue boxes are only on her screen. Nobody else sees them."}],"chapters":[{"start":2.733333,"end":12.116526114557763,"text":"Select text"},{"start":12.116526114557763,"end":17.354731807371866,"text":"Rewrite with Cori"},{"start":17.354731807371866,"end":24.902997230082573,"text":"Preview"},{"start":24.902997230082573,"end":70.06666600000001,"text":"Accept and undo"}]}</script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var video = document.querySelector('video');
  var data = JSON.parse(document.getElementById('cues').textContent);
  if (params.has('preview')) {
    document.documentElement.className = 'preview';
    var start = Number(params.get('start')) || 0;
    var end = Number(params.get('end')) || 0;
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    video.poster = video.dataset.still;
    video.muted = true;
    Array.prototype.forEach.call(document.querySelectorAll('track'), function (t) { t.remove(); });
    video.addEventListener('loadedmetadata', function () { video.currentTime = start; });
    video.addEventListener('ended', function () { video.currentTime = start; video.play().catch(function () {}); });
    if (end > start) video.addEventListener('timeupdate', function () { if (video.currentTime >= end) video.currentTime = start; });
    new IntersectionObserver(function (entries) {
      if (!entries[0].isIntersecting) { video.pause(); return; }
      video.preload = 'auto';
      if (!still) video.play().catch(function () {});
    }).observe(video);
    return;
  }
  video.controls = true;
  video.muted = true;
  Array.prototype.forEach.call(document.querySelectorAll('track'), function (el) {
    var done = false;
    function fallback() {
      if (done) return;
      done = true;
      var kind = el.kind, cues = kind === 'chapters' ? data.chapters : data.captions;
      el.remove();
      var track = video.addTextTrack(kind, el.label, el.srclang);
      cues.forEach(function (c) { track.addCue(new VTTCue(c.start, c.end, c.text)); });
      track.mode = 'hidden';
    }
    if (el.readyState === 3) fallback();
    el.addEventListener('error', fallback);
    if (el.kind === 'chapters') el.track.mode = 'hidden';
  });
})();
</script>
</body>
</html>
