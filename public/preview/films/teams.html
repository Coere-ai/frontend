<script type="application/json" id="cues">{"captions":[{"start":0.00408384881068752,"end":3.133333,"text":"Coere for Teams builds one memory of the company, its people and its clients."},{"start":3.133333,"end":5.970940244889235,"text":"The first run asks for the company once, with its clients."},{"start":5.970940244889235,"end":12.271906772833269,"text":"Maya pastes the first clients, each with its website."},{"start":12.271906772833269,"end":28.5,"text":"Then the AIs she uses at work, and Save."},{"start":28.5,"end":33.166667,"text":"Extract all saves every chat from each AI."},{"start":33.166667,"end":39.599999999999994,"text":"Cori asks what to build the company's memory from."},{"start":39.599999999999994,"end":48.26666699999999,"text":"The graph grows into Company and Clients as Coere reads the chats."},{"start":48.26666699999999,"end":52.89999999999999,"text":"The memory is ready."},{"start":52.89999999999999,"end":56.320503229604995,"text":"All shows Company and Clients around Maya, beside her own sections."},{"start":56.320503229604995,"end":63.544126967634675,"text":"Company holds the agency: its people, its way of working and its tools."},{"start":63.544126967634675,"end":73.46422324969262,"text":"Clients has a folder for each client, with its contacts and promises."},{"start":73.46422324969262,"end":84.74056314613745,"text":"Opened, Kestrel Outdoor draws its slots, and its sheet lists what sits in each."},{"start":84.74056314613745,"end":98.75441321627096,"text":"A contact at Kestrel Outdoor starts with how to reach her, her role and her client."},{"start":98.75441321627096,"end":110.3,"text":"A client the chats found waits in Review until Maya keeps it."},{"start":110.3,"end":120.3114741858318,"text":"Maya asks Cori what the team promised Kestrel Outdoor."},{"start":120.3114741858318,"end":125.86666699999999,"text":"Cori answers from memory, with each promise, its date and the AI it came from."},{"start":125.86666699999999,"end":132.64646244764194,"text":"The first time she opens an AI, Cori shows how to call him: Right Option."},{"start":132.64646244764194,"end":135.6981761743407,"text":"A tap brings out his chat, and the card is gone for good."},{"start":135.6981761743407,"end":142.55325725500384,"text":"On ChatGPT, Maya starts a reply to Kestrel Outdoor."},{"start":142.55325725500384,"end":148.79999999999998,"text":"The blue line names the client the draft is about. One client goes with each send."},{"start":148.79999999999998,"end":151.49495505990643,"text":"The Enterprise card holds the company, its people and its clients."},{"start":151.49495505990643,"end":157.38257655485134,"text":"To hand Kestrel Outdoor to a teammate, Maya exports that one client."},{"start":157.38257655485134,"end":161.666667,"text":"The line says what the file holds before she saves it."},{"start":161.666667,"end":171.35319763433273,"text":"When the work with Halvorsen Freight ends, Maya deletes everything about it."},{"start":171.35319763433273,"end":178.06720725764256,"text":"The graph lights all of it, and the sheet says what goes."},{"start":178.06720725764256,"end":181.7,"text":"Then Coere checks that nothing about it is left."},{"start":181.7,"end":184.93333299999998,"text":"Coere for Teams: one memory of the company and its clients."}],"chapters":[{"start":0,"end":3.133333,"text":"Install"},{"start":3.133333,"end":28.5,"text":"The company card"},{"start":28.5,"end":33.166667,"text":"Extract all"},{"start":33.166667,"end":52.89999999999999,"text":"The build"},{"start":52.89999999999999,"end":73.46422324969262,"text":"Company and Clients"},{"start":73.46422324969262,"end":98.75441321627096,"text":"A client"},{"start":98.75441321627096,"end":110.3,"text":"A new client"},{"start":110.3,"end":125.86666699999999,"text":"Ask Cori"},{"start":125.86666699999999,"end":148.79999999999998,"text":"The client in a chat"},{"start":148.79999999999998,"end":161.666667,"text":"Share a client"},{"start":161.666667,"end":184.93333299999998,"text":" <script>
(function () {
  var params = new URLSearchParams(location.search);
  var video = document.querySelector('video');
  var data = JSON.parse(document.getElementById('cues').textContent);
  if (params.has('preview')) {
    document.documentElement.className = 'preview';
    var start = Number(params.get('start')) || 0;
    var end = Number(params.get('end')) || 0;
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    video.poster = video.dataset.still;
    video.muted = true;
    Array.prototype.forEach.call(document.querySelectorAll('track'), function (t) { t.remove(); });
    video.addEventListener('loadedmetadata', function () { video.currentTime = start; });
    video.addEventListener('ended', function () { video.currentTime = start; video.play().catch(function () {}); });
    if (end > start) video.addEventListener('timeupdate', function () { if (video.currentTime >= end) video.currentTime = start; });
    new IntersectionObserver(function (entries) {
      if (!entries[0].isIntersecting) { video.pause(); return; }
      video.preload = 'auto';
      if (!still) video.play().catch(function () {});
    }).observe(video);
    return;
  }
  video.controls = true;
  video.muted = true;
  Array.prototype.forEach.call(document.querySelectorAll('track'), function (el) {
    var done = false;
    function fallback() {
      if (done) return;
      done = true;
      var kind = el.kind, cues = kind === 'chapters' ? data.chapters : data.captions;
      el.remove();
      var track = video.addTextTrack(kind, el.label, el.srclang);
      cues.forEach(function (c) { track.addCue(new VTTCue(c.start, c.end, c.text)); });
      track.mode = 'hidden';
    }
    if (el.readyState === 3) fallback();
    el.addEventListener('error', fallback);
    if (el.kind === 'chapters') el.track.mode = 'hidden';
  });
})();
</script>
