<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Coere v3: apps</title>
<style>
@font-face{font-family:"Coere Geist";src:url("fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
html.preview video{object-fit:cover}
video::-webkit-media-controls-mute-button,video::-webkit-media-controls-volume-slider,video::-webkit-media-controls-volume-control-container{display:none!important}
video::cue{font-family:"Coere Geist",ui-sans-serif,system-ui,sans-serif;font-size:max(12px,2.1vw);background:rgba(8,14,36,.82);color:#fff}
</style>
</head>
<body>
<video playsinline preload="metadata" poster="v3-poster.jpg" data-still="v3-still.jpg" aria-label="Coere v3: apps">
<source src="v3.mp4" type="video/mp4">
<track kind="captions" src="v3-captions.vtt" srclang="en" label="English">
<track kind="chapters" src="v3-chapters.vtt" srclang="en" label="Chapters">
</video>
<script type="application/json" id="cues">{"captions":[{"start":0.005040544049967127,"end":3.066667,"text":"Coere v3 builds the same memory as v2, and lets your own apps use it."},{"start":3.066667,"end":4.239062340045008,"text":"Installing opens onboarding. Cori asks which AIs you use."},{"start":4.239062340045008,"end":8.761704548975482,"text":"Maya uses ChatGPT, Claude and Gemini."},{"start":8.761704548975482,"end":11.133334,"text":"Save starts Extract all on each of them."},{"start":11.133334,"end":13.500001,"text":"Extract all reads each AI and saves every chat, with a row for each."},{"start":13.500001,"end":15.833333999999999,"text":"Every chat is saved on this computer."},{"start":15.833333999999999,"end":18.14385523109441,"text":"Cori asks what to build memory from. Nothing goes to an AI until Maya says yes."},{"start":18.14385523109441,"end":21.866666999999996,"text":"New chats will save by themselves, and context goes into new chats as she types."},{"start":21.866666999999996,"end":24.36551527341585,"text":"Coere reads her chats with Claude and grows the graph as it goes."},{"start":24.36551527341585,"end":26.899999999999995,"text":"Cori works away in the corner. She can close the page, and the build goes on."},{"start":26.899999999999995,"end":28.723923027250457,"text":"Cori finishes the graph with his hammer."},{"start":28.723923027250457,"end":29.833332999999996,"text":"Your memory is ready. Cori offers to show Maya around."},{"start":29.833332999999996,"end":34.066666999999995,"text":"The event planner is a small app of Maya’s. It asks Coere for access from its own code."},{"start":34.066666999999995,"end":37.890823056535446,"text":"On the Apps page, a card asks Maya to allow it, with the same code."},{"start":37.890823056535446,"end":42.26666699999999,"text":"She checks what it may do, and allows it."},{"start":42.26666699999999,"end":44.93333399999999,"text":"The planner gets its token, and keeps it to itself."},{"start":44.93333399999999,"end":47.8434570924577,"text":"Any app can ask for the context a chat would get for a draft."},{"start":47.8434570924577,"end":53.100000999999985,"text":"It prints the memories Coere would add, and where each one sits."},{"start":53.100000999999985,"end":58.61691801720363,"text":"The first time she opens an AI, Cori shows how to call him: Right Option."},{"start":58.61691801720363,"end":61.62692807823076,"text":"A tap brings out his chat, and the card is gone for good."},{"start":61.62692807823076,"end":72.36666799999999,"text":"On ChatGPT, the same words get the same memories, with her prep chat too."},{"start":72.36666799999999,"end":75.6022102940382,"text":"Maya asks the planner for a plan. It reads her memory through Coere."},{"start":75.6022102940382,"end":81.63333499999999,"text":"Each reason names the memory it came from."},{"start":81.63333499999999,"end":83.65344950156405,"text":"On the Apps page, the planner shows when it was last used."},{"start":83.65344950156405,"end":91.61012777577758,"text":"What it was sent lists every memory it got, chat by chat."},{"start":91.61012777577758,"end":98.23333499999998,"text":"Revoke takes its token away. It stops working at once."},{"start":98.23333499999998,"end":101.40000199999997,"text":"Coere v3: your memory, shared with the apps you allow."}],"chapters":[{"start":0,"end":29.833332999999996,"text":"Set up and build"},{"start":29.833332999999996,"end":44.93333399999999,"text":"An app asks"},{"start":44.93333399999999,"end":72.36666799999999,"text":"The same context"},{"start":72.36666799999999,"end":81.63333499999999,"text":"The planner"},{"start":81.63333499999999,"end":91.61012777577758,"text":"What it was sent"},{"start":91.61012777577758,"end":101.40000199999997,"text":"Revoke"}]}</script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var video = document.querySelector('video');
  var data = JSON.parse(document.getElementById('cues').textContent);
  if (params.has('preview')) {
    document.documentElement.className = 'preview';
    var start = Number(params.get('start')) || 0;
    var end = Number(params.get('end')) || 0;
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    video.poster = video.dataset.still;
    video.muted = true;
    Array.prototype.forEach.call(document.querySelectorAll('track'), function (t) { t.remove(); });
    video.addEventListener('loadedmetadata', function () { video.currentTime = start; });
    video.addEventListener('ended', function () { video.currentTime = start; video.play().catch(function () {}); });
    if (end > start) video.addEventListener('timeupdate', function () { if (video.currentTime >= end) video.currentTime = start; });
    new IntersectionObserver(function (entries) {
      if (!entries[0].isIntersecting) { video.pause(); return; }
      video.preload = 'auto';
      if (!still) video.play().catch(function () {});
    }).observe(video);
    return;
  }
  video.controls = true;
  video.muted = true;
  Array.prototype.forEach.call(document.querySelectorAll('track'), function (el) {
    var done = false;
    function fallback() {
      if (done) return;
      done = true;
      var kind = el.kind, cues = kind === 'chapters' ? data.chapters : data.captions;
      el.remove();
      var track = video.addTextTrack(kind, el.label, el.srclang);
      cues.forEach(function (c) { track.addCue(new VTTCue(c.start, c.end, c.text)); });
      track.mode = 'hidden';
    }
    if (el.readyState === 3) fallback();
    el.addEventListener('error', fallback);
    if (el.kind === 'chapters') el.track.mode = 'hidden';
  });
})();
</script>
</body>
