<!doctype html>

<title>Coere v3: apps</title>
<style>
@font-face{font-family:"Coere Geist";src:url("fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
html.preview video{object-fit:cover}
video::cue{font-family:"Coere Geist",ui-sans-serif,system-ui,sans-serif;font-size:max(12px,2.1vw);background:rgba(8,14,36,.82);color:#fff}

<body>
<video playsinline preload="metadata" poster="v3-poster.jpg" data-still="v3-still.jpg" aria-label="Coere v3: apps">

</video>
<script type="application/json" id="cues">{"captions":[{"start":0.0030505243088655865,"end":3.2,"text":"Coere v3 builds the same memory as v2, and lets your own apps use it."},{"start":3.2,"end":4.378252221190824,"text":"Installing opens onboarding. Cori asks which AIs you use."},{"start":4.378252221190824,"end":8.465985943508818,"text":"Maya uses ChatGPT, Claude and Gemini."},{"start":8.465985943508818,"end":10.4,"text":"Save starts Extract all on each of them."},{"start":10.4,"end":12.766667,"text":"Extract all reads each AI and saves every chat, with a row for each."},{"start":12.766667,"end":14.933334,"text":"Every chat is saved on this computer."},{"start":14.933334,"end":17.15839707821699,"text":"Cori asks what to build memory from. Nothing goes to an AI until Maya says yes."},{"start":17.15839707821699,"end":20.533333999999996,"text":"New chats will save by themselves, and context goes into new chats as she types."},{"start":20.533333999999996,"end":23.02977251608133,"text":"Coere reads her chats with Claude and grows the graph as it goes."},{"start":23.02977251608133,"end":25.566666999999995,"text":"Cori works away in the corner. She can close the page, and the build goes on."},{"start":25.566666999999995,"end":27.390251490496624,"text":"Cori finishes the graph with his hammer."},{"start":27.390251490496624,"end":28.499999999999996,"text":"Your memory is ready. Cori offers to show Maya around."},{"start":28.499999999999996,"end":32.666666,"text":"The event planner is a small app of Maya’s. It asks Coere for access from its own code."},{"start":32.666666,"end":36.50048186482141,"text":"On the Apps page, a card asks Maya to allow it, with the same code."},{"start":36.50048186482141,"end":41.033333,"text":"She checks what it may do, and allows it."},{"start":41.033333,"end":43.666666,"text":"The planner gets its token, and keeps it to itself."},{"start":43.666666,"end":45.817983148760334,"text":"Any app can ask for the context a chat would get for a draft."},{"start":45.817983148760334,"end":51.066666,"text":"It prints the memories Coere would add, and where each one sits."},{"start":51.066666,"end":56.76773039034671,"text":"The first time she opens an AI, Cori shows how to call him: Right Option."},{"start":56.76773039034671,"end":59.762197668247445,"text":"A tap brings out his chat, and the card is gone for good."},{"start":59.762197668247445,"end":69.666666,"text":"On ChatGPT, the same words get the same memories, with her prep chat too."},{"start":69.666666,"end":72.8241591880109,"text":"Maya asks the planner for a plan. It reads her memory through Coere."},{"start":72.8241591880109,"end":78.86666600000001,"text":"Each reason names the memory it came from."},{"start":78.86666600000001,"end":80.88399193149873,"text":"On the Apps page, the planner shows when it was last used."},{"start":80.88399193149873,"end":88.95547033260186,"text":"What it was sent lists every memory it got, chat by chat."},{"start":88.95547033260186,"end":95.39999900000001,"text":"Revoke takes its token away. It stops working at once."},{"start":95.39999900000001,"end":98.566666,"text":"Coere v3: your memory, shared with the apps you allow."}],"chapters":[{"start":0,"end":28.499999999999996,"text":"Set up and build"},{"start":28.499999999999996,"end":43.666666,"text":"An app asks"},{"start":43.666666,"end":69.666666,"text":"The same context"},{"start":69.666666,"end":78.86666600000001,"text":"The planner"},{"start":78.86666600000001,"end":88.95547033260186,"text":"What it was sent"},{"start":88.95547033260186,"end":98.566666,"text":"Revoke"}]}</script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var video = document.querySelector('video');
  var data = JSON.parse(document.getElementById('cues').textContent);
  if (params.has('preview')) {
    document.documentElement.className = 'preview';
    var start = Number(params.get('start')) || 0;
    var end = Number(params.get('end')) || 0;
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    video.poster = video.dataset.still;
    video.muted = true;
    Array.prototype.forEach.call(document.querySelectorAll('track'), function (t) { t.remove(); });
    video.addEventListener('loadedmetadata', function () { video.currentTime = start; });
    video.addEventListener('ended', function () { video.currentTime = start; video.play().catch(function () {}); });
    if (end > start) video.addEventListener('timeupdate', function () { if (video.currentTime >= end) video.currentTime = start; });
    new IntersectionObserver(function (entries) {
      if (!entries[0].isIntersecting) { video.pause(); return; }
      video.preload = 'auto';
      if (!still) video.play().catch(function () {});
    }).observe(video);
    return;
  }
  video.controls = true;
  Array.prototype.forEach.call(document.querySelectorAll('track'), function (el) {
    var done = false;
    function fallback() {
      if (done) return;
      done = true;
      var kind = el.kind, cues = kind === 'chapters' ? data.chapters : data.captions;
      el.remove();
      var track = video.addTextTrack(kind, el.label, el.srclang);
      cues.forEach(function (c) { track.addCue(new VTTCue(c.start, c.end, c.text)); });
      track.mode = kind === 'captions' ? 'showing' : 'hidden';
    }
    if (el.readyState === 3) fallback();
    el.addEventListener('error', fallback);
    if (el.kind === 'chapters') el.track.mode = 'hidden';
  });
})();
</script>
