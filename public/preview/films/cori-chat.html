<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coere Cori chat</title>
<style>
@font-face{font-family:"Coere Geist";src:url("fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
html.preview video{object-fit:cover}
video::-webkit-media-controls-mute-button,video::-webkit-media-controls-volume-slider,video::-webkit-media-controls-volume-control-container{display:none!important}
video::cue{font-family:"Coere Geist",ui-sans-serif,system-ui,sans-serif;font-size:max(12px,2.1vw);background:rgba(8,14,36,.82);color:#fff}
</style>
</head>
<body>
<video playsinline preload="metadata" poster="cori-chat-poster.jpg" data-still="cori-chat-still.jpg" aria-label="Coere Cori chat">
<source src="cori-chat.mp4" type="video/mp4">
<track kind="captions" src="cori-chat-captions.vtt" srclang="en" label="English">
<track kind="chapters" src="cori-chat-chapters.vtt" srclang="en" label="Chapters">
</video>
<script type="application/json" id="cues">{"captions":[{"start":0.004045001137656427,"end":2.666667,"text":"Maya talks to Cori on the dashboard, in the toolbar and on her AI sites."},{"start":2.666667,"end":7.973079825651302,"text":"The Cori page keeps every chat she had with him, by day, wherever it started."},{"start":7.973079825651302,"end":10.98410186973948,"text":"Any of them opens where she left it, and she can carry on."},{"start":10.98410186973948,"end":19.552238142284573,"text":"Search chats finds a chat by anything either of them said."},{"start":19.552238142284573,"end":27.266666999999998,"text":"In a new chat she asks when a project is due. Cori answers from her memory."},{"start":27.266666999999998,"end":38.01012713963344,"text":"On any page, Coere’s toolbar button opens the same Cori in a popup."},{"start":38.01012713963344,"end":43.96226539710496,"text":"On an AI site Cori stays out of the way until she taps Right Option."},{"start":43.96226539710496,"end":53.199999999999996,"text":"A tap brings out his chat, right beside her conversation."},{"start":53.199999999999996,"end":57.22245803588655,"text":"Back on the Cori page, the chats from the popup and from Claude are in her history too."},{"start":57.22245803588655,"end":63.199999999999996,"text":"Opening one shows it as it was, with the memories Cori found, in today’s words."},{"start":63.199999999999996,"end":65.466667,"text":"One Cori, one history, on every surface."}],"chapters":[{"start":2.666667,"end":10.98410186973948,"text":"Your past chats"},{"start":10.98410186973948,"end":17.730594855711423,"text":"Search your chats"},{"start":17.730594855711423,"end":27.266666999999998,"text":"Ask Cori"},{"start":27.266666999999998,"end":35.4,"text":"The toolbar popup"},{"start":35.4,"end":53.199999999999996,"text":"Right Option"},{"start":53.199999999999996,"end":65.466667,"text":"One history"}]}</script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var video = document.querySelector('video');
  var data = JSON.parse(document.getElementById('cues').textContent);
  if (params.has('preview')) {
    document.documentElement.className = 'preview';
    var start = Number(params.get('start')) || 0;
    var end = Number(params.get('end')) || 0;
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    video.poster = video.dataset.still;
    video.muted = true;
    Array.prototype.forEach.call(document.querySelectorAll('track'), function (t) { t.remove(); });
    video.addEventListener('loadedmetadata', function () { video.currentTime = start; });
    video.addEventListener('ended', function () { video.currentTime = start; video.play().catch(function () {}); });
    if (end > start) video.addEventListener('timeupdate', function () { if (video.currentTime >= end) video.currentTime = start; });
    new IntersectionObserver(function (entries) {
      if (!entries[0].isIntersecting) { video.pause(); return; }
      video.preload = 'auto';
      if (!still) video.play().catch(function () {});
    }).observe(video);
    return;
  }
  video.controls = true;
  video.muted = true;
  Array.prototype.forEach.call(document.querySelectorAll('track'), function (el) {
    var done = false;
    function fallback() {
      if (done) return;
      done = true;
      var kind = el.kind, cues = kind === 'chapters' ? data.chapters : data.captions;
      el.remove();
      var track = video.addTextTrack(kind, el.label, el.srclang);
      cues.forEach(function (c) { track.addCue(new VTTCue(c.start, c.end, c.text)); });
      track.mode = 'hidden';
    }
    if (el.readyState === 3) fallback();
    el.addEventListener('error', fallback);
    if (el.kind === 'chapters') el.track.mode = 'hidden';
  });
})();
</script>
</body>
</html>
