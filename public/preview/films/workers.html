<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coere Cori's workers</title>
<style>
@font-face{font-family:"Coere Geist";src:url("fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
html.preview video{object-fit:cover}
video::-webkit-media-controls-mute-button,video::-webkit-media-controls-volume-slider,video::-webkit-media-controls-volume-control-container{display:none!important}
video::cue{font-family:"Coere Geist",ui-sans-serif,system-ui,sans-serif;font-size:max(12px,2.1vw);background:rgba(8,14,36,.82);color:#fff}
</style>
</head>
<body>
<video playsinline preload="metadata" poster="workers-poster.jpg" data-still="workers-still.jpg" aria-label="Coere Cori's workers">
<source src="workers.mp4" type="video/mp4">
<track kind="captions" src="workers-captions.vtt" srclang="en" label="English">
<track kind="chapters" src="workers-chapters.vtt" srclang="en" label="Chapters">
</video>
<script type="application/json" id="cues">{"captions":[{"start":0.006112559821095788,"end":2.733333,"text":"Some tasks need many pages read. Cori splits them across workers."},{"start":2.733333,"end":11.81051139593812,"text":"Maya asks for 20 biotech companies, each with a person to contact."},{"start":11.81051139593812,"end":14.825112866902913,"text":"Cori starts four workers. Each one searches and reads company sites in a tab of its own."},{"start":14.825112866902913,"end":21.584946311423565,"text":"The chat shows what each worker sees, live, with its own Stop and Take over."},{"start":21.584946311423565,"end":28.6,"text":"The count climbs as rows come in."},{"start":28.6,"end":31.452587227301635,"text":"Their finds merge into one table, with no company twice."},{"start":31.452587227301635,"end":48.945745470077014,"text":"Each value keeps the page it came from. Export CSV and Copy take it anywhere."},{"start":48.945745470077014,"end":70.66666700000002,"text":"In a new chat she starts another search. Stop all stops every worker and closes their tabs."},{"start":70.66666700000002,"end":73.00000000000001,"text":"Cori never invents a value. Each one names the page it came from."}],"chapters":[{"start":2.733333,"end":7.838083361987502,"text":"Find 20 companies"},{"start":7.838083361987502,"end":28.6,"text":"Watch them work"},{"start":28.6,"end":45.88219237129937,"text":"The table"},{"start":45.88219237129937,"end":73.00000000000001,"text":"Stop all"}]}</script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var video = document.querySelector('video');
  var data = JSON.parse(document.getElementById('cues').textContent);
  if (params.has('preview')) {
    document.documentElement.className = 'preview';
    var start = Number(params.get('start')) || 0;
    var end = Number(params.get('end')) || 0;
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    video.poster = video.dataset.still;
    video.muted = true;
    Array.prototype.forEach.call(document.querySelectorAll('track'), function (t) { t.remove(); });
    video.addEventListener('loadedmetadata', function () { video.currentTime = start; });
    video.addEventListener('ended', function () { video.currentTime = start; video.play().catch(function () {}); });
    if (end > start) video.addEventListener('timeupdate', function () { if (video.currentTime >= end) video.currentTime = start; });
    new IntersectionObserver(function (entries) {
      if (!entries[0].isIntersecting) { video.pause(); return; }
      video.preload = 'auto';
      if (!still) video.play().catch(function () {});
    }).observe(video);
    return;
  }
  video.controls = true;
  video.muted = true;
  Array.prototype.forEach.call(document.querySelectorAll('track'), function (el) {
    var done = false;
    function fallback() {
      if (done) return;
      done = true;
      var kind = el.kind, cues = kind === 'chapters' ? data.chapters : data.captions;
      el.remove();
      var track = video.addTextTrack(kind, el.label, el.srclang);
      cues.forEach(function (c) { track.addCue(new VTTCue(c.start, c.end, c.text)); });
      track.mode = 'hidden';
    }
    if (el.readyState === 3) fallback();
    el.addEventListener('error', fallback);
    if (el.kind === 'chapters') el.track.mode = 'hidden';
  });
})();
</script>
</body>
</html>
