<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coere Voice mode</title>
<style>
@font-face{font-family:"Coere Geist";src:url("fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
html.preview video{object-fit:cover}
video::-webkit-media-controls-mute-button,video::-webkit-media-controls-volume-slider,video::-webkit-media-controls-volume-control-container{display:none!important}
video::cue{font-family:"Coere Geist",ui-sans-serif,system-ui,sans-serif;font-size:max(12px,2.1vw);background:rgba(8,14,36,.82);color:#fff}
</style>
</head>
<body>
<video playsinline preload="metadata" poster="voice-mode-poster.jpg" data-still="voice-mode-still.jpg" aria-label="Coere Voice mode">
<source src="voice-mode.mp4" type="video/mp4">
<track kind="captions" src="voice-mode-captions.vtt" srclang="en" label="English">
<track kind="chapters" src="voice-mode-chapters.vtt" srclang="en" label="Chapters">
</video>
<script type="application/json" id="cues">{"captions":[{"start":0.004058572120373574,"end":2.933333,"text":"With Voice mode on in Settings, Maya can talk to Cori instead of typing."},{"start":2.933333,"end":4.792244561464182,"text":"On ChatGPT, she holds Right Option and asks Cori a question."},{"start":4.792244561464182,"end":7.967961259330789,"text":"Cori listens. The bars follow her voice, and her words show as she says them."},{"start":7.967961259330789,"end":9.88683240368291,"text":"She lets go, and her words go to Cori as her line."},{"start":9.88683240368291,"end":17.343647922299574,"text":"Cori answers in the chat and says his reply out loud. Stop, or any key, quiets him."},{"start":17.343647922299574,"end":24.866666,"text":"Pressed by mistake? Escape while she holds it cancels, and nothing is sent."},{"start":24.866666,"end":27.133333,"text":"The speech models run in her browser. Her voice never leaves the computer."}],"chapters":[{"start":0,"end":7.967961259330789,"text":"Hold Right Option"},{"start":7.967961259330789,"end":17.343647922299574,"text":"Let go"},{"start":17.343647922299574,"end":27.133333,"text":"Cancel"}]}</script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var video = document.querySelector('video');
  var data = JSON.parse(document.getElementById('cues').textContent);
  if (params.has('preview')) {
    document.documentElement.className = 'preview';
    var start = Number(params.get('start')) || 0;
    var end = Number(params.get('end')) || 0;
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    video.poster = video.dataset.still;
    video.muted = true;
    Array.prototype.forEach.call(document.querySelectorAll('track'), function (t) { t.remove(); });
    video.addEventListener('loadedmetadata', function () { video.currentTime = start; });
    video.addEventListener('ended', function () { video.currentTime = start; video.play().catch(function () {}); });
    if (end > start) video.addEventListener('timeupdate', function () { if (video.currentTime >= end) video.currentTime = start; });
    new IntersectionObserver(function (entries) {
      if (!entries[0].isIntersecting) { video.pause(); return; }
      video.preload = 'auto';
      if (!still) video.play().catch(function () {});
    }).observe(video);
    return;
  }
  video.controls = true;
  video.muted = true;
  Array.prototype.forEach.call(document.querySelectorAll('track'), function (el) {
    var done = false;
    function fallback() {
      if (done) return;
      done = true;
      var kind = el.kind, cues = kind === 'chapters' ? data.chapters : data.captions;
      el.remove();
      var track = video.addTextTrack(kind, el.label, el.srclang);
      cues.forEach(function (c) { track.addCue(new VTTCue(c.start, c.end, c.text)); });
      track.mode = 'hidden';
    }
    if (el.readyState === 3) fallback();
    el.addEventListener('error', fallback);
    if (el.kind === 'chapters') el.track.mode = 'hidden';
  });
})();
</script>
</body>
</html>
