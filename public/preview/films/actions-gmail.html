<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coere Actions: Gmail</title>
<style>
@font-face{font-family:"Coere Geist";src:url("fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
html.preview video{object-fit:cover}
video::-webkit-media-controls-mute-button,video::-webkit-media-controls-volume-slider,video::-webkit-media-controls-volume-control-container{display:none!important}
video::cue{font-family:"Coere Geist",ui-sans-serif,system-ui,sans-serif;font-size:max(12px,2.1vw);background:rgba(8,14,36,.82);color:#fff}
</style>
</head>
<body>
<video playsinline preload="metadata" poster="actions-gmail-poster.jpg" data-still="actions-gmail-still.jpg" aria-label="Coere Actions: Gmail">
<source src="actions-gmail.mp4" type="video/mp4">
<track kind="captions" src="actions-gmail-captions.vtt" srclang="en" label="English">
<track kind="chapters" src="actions-gmail-chapters.vtt" srclang="en" label="Chapters">
</video>
<script type="application/json" id="cues">{"captions":[{"start":0.0040638606676342524,"end":2.8,"text":"Cori can write email for Maya, in her style, from her memory."},{"start":2.8,"end":5.765558912386707,"text":"In Settings, Maya turns on Coere Browser Use."},{"start":5.765558912386707,"end":9.4,"text":"Autonomous and Bolt are the defaults. Human Review asks before each click."},{"start":9.4,"end":15.009353756912361,"text":"On the Cori page she asks for an email in her own words."},{"start":15.009353756912361,"end":17.645352462719455,"text":"Cori shows his plan and starts."},{"start":17.645352462719455,"end":23.133333,"text":"Two people in her mail are called Sam, so Cori asks which one."},{"start":23.133333,"end":26.974845231282433,"text":"Cori works in a tab of his own, in the Coere tab group, with a glow around the page."},{"start":26.974845231282433,"end":30.831496248496833,"text":"He reads her past emails with Sam, then writes in her style. The bar shows each step and Stop."},{"start":30.831496248496833,"end":34.933333,"text":"The email is in her voice, signed the way she signs."},{"start":34.933333,"end":38.90532325272022,"text":"The draft waits in Gmail, unsent. Open draft or Delete draft are one press away."},{"start":38.90532325272022,"end":47.966666,"text":"When her line says send, Cori sends."},{"start":47.966666,"end":54.599999,"text":"Sent to Priya. Undo send takes it back while Gmail still can."},{"start":54.599999,"end":56.866665999999995,"text":"Cori asks before he sends to someone you did not name."}],"chapters":[{"start":0,"end":9.4,"text":"Turn on Browser Use"},{"start":9.4,"end":14.071082876110598,"text":"Ask Cori"},{"start":14.071082876110598,"end":23.133333,"text":"The plan"},{"start":23.133333,"end":26.974845231282433,"text":"Cori is working"},{"start":26.974845231282433,"end":34.933333,"text":"Your style"},{"start":34.933333,"end":38.90532325272022,"text":"Draft saved"},{"start":38.90532325272022,"end":56.866665999999995,"text":"Send and undo"}]}</script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var video = document.querySelector('video');
  var data = JSON.parse(document.getElementById('cues').textContent);
  if (params.has('preview')) {
    document.documentElement.className = 'preview';
    var start = Number(params.get('start')) || 0;
    var end = Number(params.get('end')) || 0;
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    video.poster = video.dataset.still;
    video.muted = true;
    Array.prototype.forEach.call(document.querySelectorAll('track'), function (t) { t.remove(); });
    video.addEventListener('loadedmetadata', function () { video.currentTime = start; });
    video.addEventListener('ended', function () { video.currentTime = start; video.play().catch(function () {}); });
    if (end > start) video.addEventListener('timeupdate', function () { if (video.currentTime >= end) video.currentTime = start; });
    new IntersectionObserver(function (entries) {
      if (!entries[0].isIntersecting) { video.pause(); return; }
      video.preload = 'auto';
      if (!still) video.play().catch(function () {});
    }).observe(video);
    return;
  }
  video.controls = true;
  video.muted = true;
  Array.prototype.forEach.call(document.querySelectorAll('track'), function (el) {
    var done = false;
    function fallback() {
      if (done) return;
      done = true;
      var kind = el.kind, cues = kind === 'chapters' ? data.chapters : data.captions;
      el.remove();
      var track = video.addTextTrack(kind, el.label, el.srclang);
      cues.forEach(function (c) { track.addCue(new VTTCue(c.start, c.end, c.text)); });
      track.mode = 'hidden';
    }
    if (el.readyState === 3) fallback();
    el.addEventListener('error', fallback);
    if (el.kind === 'chapters') el.track.mode = 'hidden';
  });
})();
</script>
</body>
</html>
