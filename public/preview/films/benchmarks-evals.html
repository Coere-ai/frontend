<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coere Benchmarks and Evals</title>
<style>
@font-face{font-family:"Coere Geist";src:url("fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
html.preview video{object-fit:cover}
video::cue{font-family:"Coere Geist",ui-sans-serif,system-ui,sans-serif;font-size:max(12px,2.1vw);background:rgba(8,14,36,.82);color:#fff}
</style>
</head>
<body>
<video playsinline preload="metadata" poster="benchmarks-evals-poster.jpg" data-still="benchmarks-evals-still.jpg" aria-label="Coere Benchmarks and Evals">
<source src="benchmarks-evals.mp4" type="video/mp4">
<track kind="captions" src="benchmarks-evals-captions.vtt" srclang="en" label="English" default>
<track kind="chapters" src="benchmarks-evals-chapters.vtt" srclang="en" label="Chapters">
</video>
<script type="application/json" id="cues">{"captions":[{"start":0.003049943194815097,"end":2.666667,"text":"Coere can score its own memory, right from the dashboard."},{"start":2.666667,"end":6.465424563649151,"text":"In Settings, Enable Dev Tools adds Benchmarks and Evals to the dashboard."},{"start":6.465424563649151,"end":9.67818626368934,"text":"Runs use a separate scratch memory. Maya’s own chats and memory are never touched."},{"start":9.67818626368934,"end":11.926016101275998,"text":"She downloads LoCoMo, a public benchmark of long conversations."},{"start":11.926016101275998,"end":16.05556337541445,"text":"Before anything runs, it says about how much the run will cost."},{"start":16.05556337541445,"end":22.233334,"text":"Start builds a memory from the conversations, then answers each question and judges the answers."},{"start":22.233334,"end":26.61551993455202,"text":"The result scores it the benchmark’s own way, by category, and says what each part cost."},{"start":26.61551993455202,"end":30.766666999999998,"text":"It also shows how little context Coere sent, against the whole history."},{"start":30.766666999999998,"end":34.8,"text":"Export .txt saves the run as a plain report, with every case, its answer and its score."},{"start":34.8,"end":38.937719268896714,"text":"A second run uses a cheaper judge. She ticks both runs and presses Compare."},{"start":38.937719268896714,"end":42.966666999999994,"text":"Each score and cost side by side, with the change, ready to export."},{"start":42.966666999999994,"end":50.533333999999996,"text":"Evals runs Coere’s own checks, the same cases as the command line. Check mode costs nothing."},{"start":50.533333999999996,"end":54.166667,"text":"Every check held. Each case shows what it expected and what it got."},{"start":54.166667,"end":56.233334,"text":"Benchmarks and Evals stay off until Dev Tools is on."}],"chapters":[{"start":2.666667,"end":9.677183216015273,"text":"Dev Tools"},{"start":9.677183216015273,"end":16.05556337541445,"text":"The estimate"},{"start":16.05556337541445,"end":22.233334,"text":"A run"},{"start":22.233334,"end":30.766666999999998,"text":"Results"},{"start":30.766666999999998,"end":34.8,"text":"Export"},{"start":34.8,"end":42.966666999999994,"text":"Compare"},{"start":42.966666999999994,"end":56.233334,"text":"Evals"}]}</script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var video = document.querySelector('video');
  var data = JSON.parse(document.getElementById('cues').textContent);
  if (params.has('preview')) {
    document.documentElement.className = 'preview';
    var start = Number(params.get('start')) || 0;
    var end = Number(params.get('end')) || 0;
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    video.poster = video.dataset.still;
    video.muted = true;
    Array.prototype.forEach.call(document.querySelectorAll('track'), function (t) { t.remove(); });
    video.addEventListener('loadedmetadata', function () { video.currentTime = start; });
    video.addEventListener('ended', function () { video.currentTime = start; video.play().catch(function () {}); });
    if (end > start) video.addEventListener('timeupdate', function () { if (video.currentTime >= end) video.currentTime = start; });
    new IntersectionObserver(function (entries) {
      if (!entries[0].isIntersecting) { video.pause(); return; }
      video.preload = 'auto';
      if (!still) video.play().catch(function () {});
    }).observe(video);
    return;
  }
  video.controls = true;
  Array.prototype.forEach.call(document.querySelectorAll('track'), function (el) {
    var done = false;
    function fallback() {
      if (done) return;
      done = true;
      var kind = el.kind, cues = kind === 'chapters' ? data.chapters : data.captions;
      el.remove();
      var track = video.addTextTrack(kind, el.label, el.srclang);
      cues.forEach(function (c) { track.addCue(new VTTCue(c.start, c.end, c.text)); });
      track.mode = kind === 'captions' ? 'showing' : 'hidden';
    }
    if (el.readyState === 3) fallback();
    el.addEventListener('error', fallback);
    if (el.kind === 'chapters') el.track.mode = 'hidden';
  });
})();
</script>
</body>
</html>
