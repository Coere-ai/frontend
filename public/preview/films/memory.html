<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coere Memory</title>
<style>
@font-face{font-family:"Coere Geist";src:url("fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
html.preview video{object-fit:cover}
video::-webkit-media-controls-mute-button,video::-webkit-media-controls-volume-slider,video::-webkit-media-controls-volume-control-container{display:none!important}
video::cue{font-family:"Coere Geist",ui-sans-serif,system-ui,sans-serif;font-size:max(12px,2.1vw);background:rgba(8,14,36,.82);color:#fff}
</style>
</head>
<body>
<video playsinline preload="metadata" poster="memory-poster.jpg" data-still="memory-still.jpg" aria-label="Coere Memory">
<source src="memory.mp4" type="video/mp4">
<track kind="captions" src="memory-captions.vtt" srclang="en" label="English">
<track kind="chapters" src="memory-chapters.vtt" srclang="en" label="Chapters">
</video>
<script type="application/json" id="cues">{"captions":[{"start":0.0020332954632100646,"end":2.666667,"text":"Coere builds a memory from Maya’s chats, with her own keys."},{"start":2.666667,"end":7.6,"text":"Nothing goes to an AI until she presses Build my memory."},{"start":7.6,"end":14.233333,"text":"Coere reads her chats and the graph grows, section by section."},{"start":14.233333,"end":17.43977248927062,"text":"The Memory page draws everything as one graph, with Maya in the middle and a section for each part of her life."},{"start":17.43977248927062,"end":20.446806525135834,"text":"Each memory sits beside the chats it came from, the small dots around it."},{"start":20.446806525135834,"end":26.425850905932712,"text":"All shows both. Memories shows only what Coere learned."},{"start":26.425850905932712,"end":36.079380804099664,"text":"Chats shows only the chats, each round the thing it taught."},{"start":36.079380804099664,"end":42.1594935501619,"text":"A click opens a section, with its folders, memories and chats."},{"start":42.1594935501619,"end":50.300000000000004,"text":"Search lists the top four matches and lights them on the graph."},{"start":50.300000000000004,"end":52.36666700000001,"text":"Every memory keeps the chat and the words it came from."}],"chapters":[{"start":0,"end":7.6,"text":"Build your memory"},{"start":7.6,"end":14.233333,"text":"The graph grows"},{"start":14.233333,"end":20.446806525135834,"text":"Your memory"},{"start":20.446806525135834,"end":36.079380804099664,"text":"Memories and chats"},{"start":36.079380804099664,"end":42.1594935501619,"text":"Up close"},{"start":42.1594935501619,"end":52.36666700000001,"text":"Search"}]}</script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var video = document.querySelector('video');
  var data = JSON.parse(document.getElementById('cues').textContent);
  if (params.has('preview')) {
    document.documentElement.className = 'preview';
    var start = Number(params.get('start')) || 0;
    var end = Number(params.get('end')) || 0;
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    video.poster = video.dataset.still;
    video.muted = true;
    Array.prototype.forEach.call(document.querySelectorAll('track'), function (t) { t.remove(); });
    video.addEventListener('loadedmetadata', function () { video.currentTime = start; });
    video.addEventListener('ended', function () { video.currentTime = start; video.play().catch(function () {}); });
    if (end > start) video.addEventListener('timeupdate', function () { if (video.currentTime >= end) video.currentTime = start; });
    new IntersectionObserver(function (entries) {
      if (!entries[0].isIntersecting) { video.pause(); return; }
      video.preload = 'auto';
      if (!still) video.play().catch(function () {});
    }).observe(video);
    return;
  }
  video.controls = true;
  video.muted = true;
  Array.prototype.forEach.call(document.querySelectorAll('track'), function (el) {
    var done = false;
    function fallback() {
      if (done) return;
      done = true;
      var kind = el.kind, cues = kind === 'chapters' ? data.chapters : data.captions;
      el.remove();
      var track = video.addTextTrack(kind, el.label, el.srclang);
      cues.forEach(function (c) { track.addCue(new VTTCue(c.start, c.end, c.text)); });
      track.mode = 'hidden';
    }
    if (el.readyState === 3) fallback();
    el.addEventListener('error', fallback);
    if (el.kind === 'chapters') el.track.mode = 'hidden';
  });
})();
</script>
</body>
</html>
