<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coere Smart context</title>
<style>
@font-face{font-family:"Coere Geist";src:url("fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
html.preview video{object-fit:cover}
video::cue{font-family:"Coere Geist",ui-sans-serif,system-ui,sans-serif;font-size:max(12px,2.1vw);background:rgba(8,14,36,.82);color:#fff}
</style>
</head>
<body>
<video playsinline preload="metadata" poster="smart-context-poster.jpg" data-still="smart-context-still.jpg" aria-label="Coere Smart context">
<source src="smart-context.mp4" type="video/mp4">
<track kind="captions" src="smart-context-captions.vtt" srclang="en" label="English" default>
<track kind="chapters" src="smart-context-chapters.vtt" srclang="en" label="Chapters">
</video>
<script type="application/json" id="cues">{"captions":[{"start":0.0030511064073226544,"end":2.666667,"text":"Smart context adds what Maya’s new chat needs, as she types."},{"start":2.666667,"end":5.993707424581006,"text":"In a fresh ChatGPT chat, Maya asks for help with her PearX interview."},{"start":5.993707424581006,"end":11.805448494812449,"text":"The blue line says what goes with it: her earlier prep chat, and the AIs she had it with."},{"start":11.805448494812449,"end":16.010879177972868,"text":"The list shows all of it: the chat, who she is, and what she knows about PearX and Tidepool."},{"start":16.010879177972868,"end":23.531013912210696,"text":"Add memory searches her memory. The top four show, and what matches lights up."},{"start":23.531013912210696,"end":33.4320909584996,"text":"Ask Cori takes it in her own words, and adds the notes she meant."},{"start":33.4320909584996,"end":38.633334,"text":"One Enter puts it all in front of her draft and sends. ChatGPT starts from the work she already did."},{"start":38.633334,"end":42.75459175714657,"text":"In another chat she brings up her side project."},{"start":42.75459175714657,"end":50.3771419337578,"text":"Coere adds who she is and what it knows about SkipDoodle."},{"start":50.3771419337578,"end":58.306116224142414,"text":"Then she asks a follow up in the same chat."},{"start":58.306116224142414,"end":69.2903191783264,"text":"Nothing new goes with it. ChatGPT already has it."},{"start":69.2903191783264,"end":76.76666700000001,"text":"Later, asking about the stack brings SkipDoodle’s tech stack back."},{"start":76.76666700000001,"end":79.89883086779335,"text":"For a long context, Dev Tools has File Upload (beta)."},{"start":79.89883086779335,"end":85.76666700000001,"text":"With it on, a context longer than the number she sets goes as a text file. A short one stays as text."},{"start":85.76666700000001,"end":91.88718766871418,"text":"Her PearX prep chat makes this context long."},{"start":91.88718766871418,"end":100.03333400000001,"text":"One Enter attaches it as coere-context.txt, puts a short note in front of her draft, and sends once."},{"start":100.03333400000001,"end":102.30000100000001,"text":"What goes is always on the line above the box, to change before she sends."}],"chapters":[{"start":0,"end":5.993707424581006,"text":"Type a message"},{"start":5.993707424581006,"end":16.010879177972868,"text":"What goes with it"},{"start":16.010879177972868,"end":33.4320909584996,"text":"Add more"},{"start":33.4320909584996,"end":38.633334,"text":"One Enter"},{"start":38.633334,"end":76.76666700000001,"text":"In one chat"},{"start":76.76666700000001,"end":102.30000100000001,"text":"File Upload (beta)"}]}</script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var video = document.querySelector('video');
  var data = JSON.parse(document.getElementById('cues').textContent);
  if (params.has('preview')) {
    document.documentElement.className = 'preview';
    var start = Number(params.get('start')) || 0;
    var end = Number(params.get('end')) || 0;
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    video.poster = video.dataset.still;
    video.muted = true;
    Array.prototype.forEach.call(document.querySelectorAll('track'), function (t) { t.remove(); });
    video.addEventListener('loadedmetadata', function () { video.currentTime = start; });
    video.addEventListener('ended', function () { video.currentTime = start; video.play().catch(function () {}); });
    if (end > start) video.addEventListener('timeupdate', function () { if (video.currentTime >= end) video.currentTime = start; });
    new IntersectionObserver(function (entries) {
      if (!entries[0].isIntersecting) { video.pause(); return; }
      video.preload = 'auto';
      if (!still) video.play().catch(function () {});
    }).observe(video);
    return;
  }
  video.controls = true;
  Array.prototype.forEach.call(document.querySelectorAll('track'), function (el) {
    var done = false;
    function fallback() {
      if (done) return;
      done = true;
      var kind = el.kind, cues = kind === 'chapters' ? data.chapters : data.captions;
      el.remove();
      var track = video.addTextTrack(kind, el.label, el.srclang);
      cues.forEach(function (c) { track.addCue(new VTTCue(c.start, c.end, c.text)); });
      track.mode = kind === 'captions' ? 'showing' : 'hidden';
    }
    if (el.readyState === 3) fallback();
    el.addEventListener('error', fallback);
    if (el.kind === 'chapters') el.track.mode = 'hidden';
  });
})();
</script>
</body>
</html>
