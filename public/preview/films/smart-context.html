<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Coere Smart context</title>
<style>
@font-face{font-family:"Coere Geist";src:url("fonts/Geist-Variable.woff2") format("woff2");font-weight:100 900;font-display:swap}
html,body{margin:0;height:100%;overflow:hidden;background:#000}
video{display:block;width:100%;height:100%;object-fit:contain;background:#000}
html.preview video{object-fit:cover}
video::-webkit-media-controls-mute-button,video::-webkit-media-controls-volume-slider,video::-webkit-media-controls-volume-control-container{display:none!important}
video::cue{font-family:"Coere Geist",ui-sans-serif,system-ui,sans-serif;font-size:max(12px,2.1vw);background:rgba(8,14,36,.82);color:#fff}
</style>
</head>
<body>
<video playsinline preload="metadata" poster="smart-context-poster.jpg" data-still="smart-context-still.jpg" aria-label="Coere Smart context">
<source src="smart-context.mp4" type="video/mp4">
<track kind="captions" src="smart-context-captions.vtt" srclang="en" label="English">
<track kind="chapters" src="smart-context-chapters.vtt" srclang="en" label="Chapters">
</video>
<script type="application/json" id="cues">{"captions":[{"start":0.004091815868263474,"end":2.733333,"text":"Smart context adds what Maya’s new chat needs, as she types."},{"start":2.733333,"end":6.846978454613634,"text":"In a fresh ChatGPT chat, Maya asks for help with her PearX interview."},{"start":6.846978454613634,"end":13.322208186620333,"text":"The blue line says what goes with it: her earlier prep chat, and the AIs she had it with."},{"start":13.322208186620333,"end":17.53360953318667,"text":"The list shows all of it: the chat, who she is, and what she knows about PearX and Tidepool."},{"start":17.53360953318667,"end":26.419786471438215,"text":"Add memory searches her memory. The top four show, and what matches lights up."},{"start":26.419786471438215,"end":36.923269630234245,"text":"Ask Cori takes it in her own words, and adds the notes she meant."},{"start":36.923269630234245,"end":42.366666,"text":"One Enter puts it all in front of her draft and sends. ChatGPT starts from the work she already did."},{"start":42.366666,"end":47.38172535193248,"text":"In another chat she brings up her side project."},{"start":47.38172535193248,"end":55.698567618417535,"text":"Coere adds who she is and what it knows about SkipDoodle."},{"start":55.698567618417535,"end":64.48602340106535,"text":"Then she asks a follow up in the same chat."},{"start":64.48602340106535,"end":75.49437445786005,"text":"Nothing new goes with it. ChatGPT already has it."},{"start":75.49437445786005,"end":83.13333300000001,"text":"Later, asking about the stack brings SkipDoodle’s tech stack back."},{"start":83.13333300000001,"end":86.32994050426647,"text":"For a long context, Dev Tools has File Upload (beta)."},{"start":86.32994050426647,"end":92.5,"text":"With it on, a context longer than the number she sets goes as a text file. A short one stays as text."},{"start":92.5,"end":98.78060616672131,"text":"Her PearX prep chat makes this context long."},{"start":98.78060616672131,"end":107.366667,"text":"One Enter attaches it as coere-context.txt, puts a short note in front of her draft, and sends once."},{"start":107.366667,"end":109.633334,"text":"What goes is always on the line above the box, to change before she sends."}],"chapters":[{"start":0,"end":6.846978454613634,"text":"Type a message"},{"start":6.846978454613634,"end":17.53360953318667,"text":"What goes with it"},{"start":17.53360953318667,"end":36.923269630234245,"text":"Add more"},{"start":36.923269630234245,"end":42.366666,"text":"One Enter"},{"start":42.366666,"end":83.13333300000001,"text":"In one chat"},{"start":83.13333300000001,"end":109.633334,"text":"File Upload (beta)"}]}</script>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var video = document.querySelector('video');
  var data = JSON.parse(document.getElementById('cues').textContent);
  if (params.has('preview')) {
    document.documentElement.className = 'preview';
    var start = Number(params.get('start')) || 0;
    var end = Number(params.get('end')) || 0;
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    video.poster = video.dataset.still;
    video.muted = true;
    Array.prototype.forEach.call(document.querySelectorAll('track'), function (t) { t.remove(); });
    video.addEventListener('loadedmetadata', function () { video.currentTime = start; });
    video.addEventListener('ended', function () { video.currentTime = start; video.play().catch(function () {}); });
    if (end > start) video.addEventListener('timeupdate', function () { if (video.currentTime >= end) video.currentTime = start; });
    new IntersectionObserver(function (entries) {
      if (!entries[0].isIntersecting) { video.pause(); return; }
      video.preload = 'auto';
      if (!still) video.play().catch(function () {});
    }).observe(video);
    return;
  }
  video.controls = true;
  video.muted = true;
  Array.prototype.forEach.call(document.querySelectorAll('track'), function (el) {
    var done = false;
    function fallback() {
      if (done) return;
      done = true;
      var kind = el.kind, cues = kind === 'chapters' ? data.chapters : data.captions;
      el.remove();
      var track = video.addTextTrack(kind, el.label, el.srclang);
      cues.forEach(function (c) { track.addCue(new VTTCue(c.start, c.end, c.text)); });
      track.mode = 'hidden';
    }
    if (el.readyState === 3) fallback();
    el.addEventListener('error', fallback);
    if (el.kind === 'chapters') el.track.mode = 'hidden';
  });
})();
</script>
</body>
</html>
