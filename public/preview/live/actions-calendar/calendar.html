body{font:14px/20px Roboto,"Helvetica Neue",Arial,sans-serif;color:#3c4043;background:#fff}
button{font:inherit}
.frame{display:flex;flex-direction:column;height:100vh}
.gb{display:flex;align-items:center;gap:8px;height:64px;padding:8px 16px 8px 12px;border-bottom:1px solid #dadce0;flex:none}
.brand{display:flex;align-items:center;gap:8px;color:#3c4043;text-decoration:none;font-size:22px;width:200px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:0;border-radius:50%;background:none;color:#5f6368;cursor:pointer}
.icon-btn:hover{background:rgba(60,64,67,.08)}
.pill{height:36px;padding:0 16px;border:1px solid #dadce0;border-radius:18px;background:#fff;color:#3c4043;cursor:pointer;font-weight:500}
.week-nav{display:flex;align-items:center;gap:4px}
.month{font-size:22px;font-weight:400;margin:0 0 0 12px;color:#3c4043}
.gb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#7b5ea7;color:#fff;text-decoration:none;font-weight:500}
.app{display:flex;flex:1;min-height:0}
.side{width:256px;flex:none;padding:16px 8px}
.create{display:inline-flex;align-items:center;gap:12px;height:56px;padding:0 24px 0 16px;border:0;border-radius:16px;background:#fff;box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15);cursor:pointer;color:#3c4043;font-weight:500}
.cals{margin-top:32px;padding:0 16px;display:flex;flex-direction:column;gap:6px}
.cals-head{font-weight:500;margin-bottom:4px}
.main{flex:1;min-width:0;overflow:auto;position:relative}
.days{display:grid;grid-template-columns:64px repeat(7,1fr);position:sticky;top:0;background:#fff;z-index:3;border-bottom:1px solid #dadce0}
.dayhead{text-align:center;padding:8px 0}
.dayhead .dow{font-size:11px;font-weight:500;color:#70757a;letter-spacing:.8px}
.dayhead .num{font-size:26px;line-height:46px;width:46px;height:46px;margin:0 auto;border-radius:50%}
.dayhead.today .num{background:#1a73e8;color:#fff}
.grid{display:grid;grid-template-columns:64px repeat(7,1fr);position:relative}
.hours{display:flex;flex-direction:column}
.hour{height:48px;font-size:10px;color:#70757a;text-align:right;padding-right:8px;transform:translateY(-7px)}
.col{position:relative;border-left:1px solid #dadce0;background:repeating-linear-gradient(#fff 0 47px,#dadce0 47px 48px)}
.ev{position:absolute;left:2px;right:6px;border-radius:6px;background:#039be5;color:#fff;padding:2px 6px;font-size:12px;line-height:16px;overflow:hidden;cursor:pointer;border:1px solid #fff}
.ev.mine{background:#7986cb}
.ev .t{font-weight:500;display:block}
.allday{grid-column:2/9;display:grid;grid-template-columns:repeat(7,1fr);min-height:4px}
.allday .ev{position:static;margin:2px 4px}
#snack-root{position:fixed;left:24px;bottom:24px;z-index:30}
.snack{display:flex;align-items:center;gap:24px;min-width:300px;padding:14px 16px;border-radius:4px;background:#323232;color:#fff;box-shadow:0 3px 5px rgba(0,0,0,.2)}
.snack a{color:#8ab4f8;font-weight:500;text-decoration:none}
.pop{position:absolute;z-index:10;width:420px;background:#fff;border-radius:8px;box-shadow:0 24px 38px 3px rgba(0,0,0,.14),0 9px 46px 8px rgba(0,0,0,.12);padding:8px 8px 24px}
.pop .tools{display:flex;justify-content:flex-end}
.pop h2{font-size:22px;font-weight:400;margin:4px 24px}
.pop p{margin:4px 24px;color:#3c4043}
.editor{display:flex;flex-direction:column;height:100%}
.ed-top{display:flex;align-items:center;gap:12px;padding:8px 16px;border-bottom:1px solid #dadce0}
.ed-title{flex:1;max-width:760px;height:52px;border:0;border-bottom:1px solid #dadce0;font-size:22px;background:#f1f3f4;padding:0 12px;outline:none;border-radius:4px 4px 0 0}
.save{height:36px;padding:0 24px;border:0;border-radius:4px;background:#1a73e8;color:#fff;cursor:pointer;font-weight:500}
.ed-body{display:flex;gap:32px;padding:16px 56px;overflow:auto}
.ed-left{flex:1;max-width:760px;display:flex;flex-direction:column;gap:14px}
.ed-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ed-row input[type=text]{height:36px;border:0;background:#f1f3f4;border-radius:4px;padding:0 10px;font:inherit;color:#3c4043}
.ed-row .wide{flex:1}
.ed-row input[aria-label$=date]{width:132px}.ed-row input[aria-label$=time]{width:92px}
.zone{color:#1a73e8;cursor:pointer;background:none;border:0;padding:0}
.tabs{display:flex;gap:24px;border-bottom:1px solid #dadce0}
.tabs span{padding:8px 0;color:#5f6368;font-weight:500}
.tabs span.on{color:#1a73e8;box-shadow:inset 0 -3px 0 #1a73e8}
.desc{min-height:160px;background:#f1f3f4;border-radius:4px;padding:10px;outline:none;white-space:pre-wrap}
.ed-right{width:340px;flex:none}
.ed-right h3{font-size:16px;font-weight:500;margin:10px 0}
.guest-in{width:100%;height:36px;border:0;background:#f1f3f4;border-radius:4px;padding:0 10px;font:inherit}
.suggest{position:absolute;width:340px;background:#fff;border-radius:8px;box-shadow:0 2px 6px 2px rgba(60,64,67,.15);padding:6px 0;z-index:5}
.suggest [role=option]{padding:6px 16px;cursor:pointer;display:flex;flex-direction:column}
.suggest [role=option][aria-selected=true],.suggest [role=option]:hover{background:#e8eaed}
.suggest .em{font-size:12px;color:#5f6368}
.guest{display:flex;align-items:center;gap:10px;padding:8px 0}
.guest .av{width:28px;height:28px;border-radius:50%;background:#e8f0fe;color:#1967d2;display:flex;align-items:center;justify-content:center;font-weight:500}
.guest .nm{flex:1;display:flex;flex-direction:column}
.guest .em{font-size:12px;color:#5f6368}
.perms{margin-top:16px;display:flex;flex-direction:column;gap:6px;color:#3c4043}
.dialog-back{position:fixed;inset:0;background:rgba(32,33,36,.6);display:flex;align-items:center;justify-content:center;z-index:40}
.dialog{background:#fff;border-radius:8px;padding:24px;width:460px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.dialog .row{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
.dialog .row button{border:0;background:none;color:#1a73e8;font-weight:500;height:36px;padding:0 12px;cursor:pointer;border-radius:4px}
.missing{padding:48px;color:#5f6368}
