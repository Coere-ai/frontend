<script>"use strict";(()=>{var ae=`/* Coere's palette and the stage. One accent (Coere blue), ink, and tints of
   the accent: the same tokens the product uses. The fonts' @font-face rules
   are written by the build, from the files the extension ships. */
:root {
  color-scheme: light;
  --ink: #080e24;
  --ink2: #1b2340;
  --mute: rgba(8, 14, 36, 0.6);
  --quiet: rgba(8, 14, 36, 0.42);
  --line: rgba(8, 14, 36, 0.09);
  --line2: rgba(8, 14, 36, 0.16);
  --fill: rgba(8, 14, 36, 0.04);
  --fill2: rgba(8, 14, 36, 0.07);
  --acc: #5267f7;
  --acc-text: #4355cd;
  --acc2: #8695f9;
  --acc3: #b9c1fb;
  --tint: #eef0fe;
  --tint2: #dce1fd;
  --tint-line: #c9d0fb;
  --tint-line2: #a0abfb;
  --ok: #16a34a;
  --bad: #d93025;
  --bg: #ffffff;
  --sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --serif: 'Iowan Old Style', 'Charter', Georgia, 'Times New Roman', serif;
  --arial: Arial, 'Helvetica Neue', Helvetica, sans-serif;
  --sh-sm: 0 1px 2px rgba(8, 14, 36, 0.06);
  --sh-md: 0 1px 2px rgba(8, 14, 36, 0.04), 0 6px 20px rgba(8, 14, 36, 0.07);
  --sh-lg: 0 2px 6px rgba(8, 14, 36, 0.05), 0 18px 48px rgba(8, 14, 36, 0.14);
  --sh-win: 0 1px 2px rgba(8, 14, 36, 0.05), 0 24px 70px rgba(8, 14, 36, 0.13);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }
button { font: inherit; }
[hidden] { display: none !important; }

#viewport { position: fixed; inset: 0; background: var(--bg); overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: var(--bg); font-family: var(--sans); color: var(--ink); }
body.clean #stage, body.clean #viewport { cursor: none; }

/* A scene is an opaque layer, so the next one can dissolve over it. */
.k-scene { position: absolute; inset: 0; background: var(--bg); overflow: hidden; }
.abs { position: absolute; }
.mono { font-family: var(--mono); }
.ico { display: inline-flex; flex: none; }
.ico svg { width: 100%; height: 100%; display: block; }
.mark { display: block; flex: none; }
.zoom { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; }

/* Captions: one line in the band above the window, or the pitch's two lines. */
.cap { position: absolute; z-index: 60; pointer-events: none; }
.cap1 { left: 48px; top: 22px; height: 44px; display: flex; align-items: center; gap: 14px; font-size: 29px; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); white-space: nowrap; }
.cap2 { left: 100px; top: 46px; }
.cap2 .eb { display: flex; align-items: center; gap: 10px; font-size: 19px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--acc-text); }
.cap2 .tt { margin-top: 10px; font-size: 40px; font-weight: 600; letter-spacing: -0.025em; line-height: 1.1; color: var(--ink); white-space: nowrap; }

/* Subtitles for spoken words. */
.subt { position: absolute; left: 50%; bottom: 46px; z-index: 61; max-width: 1300px; pointer-events: none; }
.subt span { display: inline-block; padding: 12px 26px; border-radius: 14px; background: rgba(8, 14, 36, 0.86); color: #fff; font-size: 30px; font-weight: 500; line-height: 1.35; letter-spacing: -0.01em; text-align: center; }
`;var ne=`/* The player: a big play button over the poster frame, and a bar with play,
   time, a scrub track with chapter marks, the chapter name, hide and full
   screen. */
#bigplay { position: fixed; left: 50%; top: 50%; width: 132px; height: 132px; margin: -66px 0 0 -66px; border-radius: 50%; border: 0; background: var(--acc); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 18px 50px rgba(82, 103, 247, 0.42); z-index: 30; transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), opacity 0.25s; }
#bigplay svg { width: 56px; height: 56px; fill: #fff; margin-left: 8px; }
#bigplay:hover { transform: scale(1.05); }
#bigplay:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
body.poster #viewport::after { content: ''; position: absolute; inset: 0; background: rgba(255, 255, 255, 0.55); backdrop-filter: blur(6px); }

#hotzone { position: fixed; left: 0; right: 0; bottom: 0; height: 36px; z-index: 39; display: none; }
body.hidebar #hotzone { display: block; }
#bar { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(1100px, calc(100vw - 32px)); height: 58px; border-radius: 29px; background: rgba(8, 14, 36, 0.84); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); color: #fff; display: flex; align-items: center; gap: 14px; padding: 0 12px 0 10px; z-index: 40; box-shadow: 0 10px 34px rgba(8, 14, 36, 0.28); transition: opacity 0.28s ease, transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1); }
#bar.away { opacity: 0; transform: translate(-50%, 12px); pointer-events: none; }
.ctl { width: 40px; height: 40px; border-radius: 20px; border: 0; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
.ctl:hover { background: rgba(255, 255, 255, 0.12); }
.ctl:focus-visible { outline: 2px solid #a0abfb; outline-offset: 1px; }
.ctl svg { width: 22px; height: 22px; fill: currentColor; }
#hide svg, #fs svg { fill: none; }
#pp .i-pause { display: none; }
body.playing #pp .i-play { display: none; }
body.playing #pp .i-pause { display: block; }
#time { font-size: 13.5px; color: rgba(255, 255, 255, 0.82); font-variant-numeric: tabular-nums; white-space: nowrap; flex: none; }
#track { position: relative; flex: 1; min-width: 0; height: 40px; cursor: pointer; outline: none; touch-action: none; }
#track:focus-visible #rail { box-shadow: 0 0 0 2px #a0abfb; }
#rail { position: absolute; left: 0; right: 0; top: 18px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.22); overflow: hidden; }
#fill { height: 100%; width: 0; background: #8695f9; }
#marks i { position: absolute; top: 14px; width: 2px; height: 12px; margin-left: -1px; border-radius: 1px; background: rgba(255, 255, 255, 0.7); }
#knob { position: absolute; top: 13px; width: 14px; height: 14px; margin-left: -7px; border-radius: 7px; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35); }

GOALS
- Tidepool helps families find after school care that fits their week.
- Onboarding today: the child's age, then the family's week, then matched daycares.
- Goal for November: a first match in under two minutes.
- 38% of families drop off at step two, the weekly schedule.

SCHEMA
create table families (
  id uuid primary key default gen_random_uuid(),
  email text not null unique,
  zip text not null,
  created_at timestamptz default now()
);
create table children (
  id uuid primary key default gen_random_uuid(),
  family_id uuid references families(id) on delete cascade,
  birth_month date not null,
  needs text[]
);
create table schedules (
  child_id uuid references children(id),
  weekday int check (weekday between 1 and 5),
  dropoff time,
  pickup time
);

CONSTRAINTS
- Postgres on Supabase, the app is React Native with Expo.
- No new tables before the seed round; reuse schedules.
- Three pilot daycares in Berkeley: Little Acorns, Sunbeam and Bayview Kids.
- Copy stays short and warm, no exclamation marks.

RETRIEVAL NOTES
- Match on zip first, then pickup time within 30 minutes.
- Cache daycare openings for ten minutes; they change at noon.
- Last week we decided to drop the needs field from step one.
